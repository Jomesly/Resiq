name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  production-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deploy/generate-env.py --domain receipts.example.invalid --output deploy/.env.ci
      - run: docker compose --env-file deploy/.env.ci -f deploy/compose.production.yml config --quiet
      - run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://receipts.example.invalid -t resiq-frontend:ci frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resiq
          POSTGRES_PASSWORD: resiq-local-only
          POSTGRES_DB: resiq
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U resiq -d resiq"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr
      - run: pip install -c constraints.txt '.[dev,s3]'
      - run: ruff check app tests migrations eval ../deploy/backup.py ../deploy/generate-env.py && ruff format --check app tests migrations eval ../deploy/backup.py ../deploy/generate-env.py
      - run: alembic upgrade head && alembic check
      - run: pytest
      - run: python eval/run.py --engine tesseract --output eval/results-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-ocr-evaluation
          path: backend/eval/results-ci.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results
  connected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d --build
        env:
          CORS_ORIGINS: '["http://localhost:3001"]'
      - run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          npm run start -- --port 3001 > /tmp/resiq-frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3001 >/dev/null && break; sleep 1; done
          npx playwright test --config playwright.integration.config.ts
        working-directory: frontend
      - run: docker compose logs
        if: failure()
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c backend/constraints.txt httpx
      - run: python eval/load.py --count 8 --concurrency 2 --output eval/load-results-ci.json
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-load-smoke
          path: backend/eval/load-results-ci.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: connected-failure-traces
          path: frontend/test-results
