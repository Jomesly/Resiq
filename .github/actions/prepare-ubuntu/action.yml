name: Prepare Ubuntu packages
description: Use official Ubuntu mirrors and bounded retries for CI package downloads.
runs:
  using: composite
  steps:
    - name: Configure reliable Ubuntu mirrors
      shell: bash
      run: |
        # Hosted runners use mirror lists whose Azure endpoint can fail DNS.
        # Keep APT signature verification and use Ubuntu's official endpoints.
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi
        if [[ -f /etc/apt/apt-security-mirrors.txt ]]; then
          printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt >/dev/null
        fi
        sudo tee /etc/apt/apt.conf.d/80resiq-ci-network >/dev/null <<'EOF'
        Acquire::Retries "3";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        EOF
        sudo apt-get update --error-on=any
