name: resiq
services:
  migrate:
    build:
      context: ./backend
      target: base
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://resiq:resiq-local-only@db:5432/resiq
      SIGNING_SECRET: ${SIGNING_SECRET:-resiq-development-only-change-before-deploying}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:8000}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STORAGE_ROOT: /data
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ./backend
      target: base
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - receipt-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
  worker:
    build:
      context: ./backend
      target: ${WORKER_TARGET:-paddle}
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    volumes:
      - receipt-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resiq
      POSTGRES_PASSWORD: resiq-local-only
      POSTGRES_DB: resiq
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resiq -d resiq"]
      interval: 3s
      timeout: 3s
      retries: 20
  maintenance:
    build:
      context: ./backend
      target: base
    environment: *backend-env
    command: ["python", "-m", "app.maintenance"]
    volumes:
      - receipt-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres-data:
  receipt-data:
